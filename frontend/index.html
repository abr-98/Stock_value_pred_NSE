<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock AI Workspace - Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/styles.css" />
</head>
<body data-page="account">
  <div class="bg-grid"></div>

  <main class="page page-center" id="accountPage">
    <section class="card auth-card">
      <h2>Account Access</h2>
      <p class="muted">Sign in to continue to your Streamlit-powered workspace.</p>
      <p id="sessionBanner" class="session-banner hidden"></p>
      <div class="tabs">
        <button class="tab-btn active" data-auth-mode="login">Login</button>
        <button class="tab-btn" data-auth-mode="register">Register</button>
      </div>
      <div class="form-grid">
        <input id="emailInput" type="email" placeholder="Email" />
        <input id="passwordInput" type="password" placeholder="Password" />
        <select id="planTypeInput">
          <option value="free">free</option>
          <option value="pro">pro</option>
        </select>
        <button id="authSubmitBtn">Login</button>
      </div>
    </section>
  </main>

  <main class="page page-center hidden" id="loadingPage">
    <section class="card loading-card">
      <div class="loader"></div>
      <h2>Loading Workspace</h2>
      <p class="muted">Preparing your account and redirecting to Streamlit page...</p>
    </section>
  </main>

  <aside id="toast" class="toast hidden"></aside>

  <script src="/frontend/app.js"></script>
</body>
</html>
